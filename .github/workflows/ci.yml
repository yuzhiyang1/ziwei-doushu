name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 回归 + 浏览器验收
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 仓库已提交 package-lock.json：按锁定版本安装，并开 npm 缓存
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 排盘引擎回归
        run: npm test

      - name: 静态生产构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: 安装浏览器（保留 Chromium sandbox）
        run: npx playwright install --with-deps chromium

      - name: 浏览器本地流程验收（AI mocked）
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /tmp/ziwei-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
          npm run test:ui
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: 保留浏览器验收截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ui-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
